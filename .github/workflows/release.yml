name: release

# A tag is a promise: this workflow is what makes it one. Pushing v* produces
# downloadable archives for every supported platform, plus checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a commit, not a mutable major tag:
      # this job holds a write token, so a moved tag must not be able to run
      # different code. Update the SHA and the comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The changelog is generated from git history, so the whole history
          # and the tag have to be present.
          fetch-depth: 0

      # A tag is only trustworthy on a commit that already passed CI. Tagging a
      # side branch or a local experiment must fail here, not publish binaries.
      - name: require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not reachable from main; refusing to publish"
            exit 1
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Same flags as CI: a release must not be built on a weaker signal than
      # the one that gated the merge.
      - name: run the test suite before publishing anything
        run: go test -race ./...

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
